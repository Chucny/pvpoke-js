server {
    listen 80;
    server_name _;

    # src/ is the document root. Everything the site serves lives there, and
    # WEB_ROOT in js/Boot.js assumes the site is mounted at "/".
    root /usr/share/nginx/html;
    index index.html;

    # Matches `Options -Indexes` from the old .htaccess.
    autoindex off;

    # Old inbound URLs the .htaccess redirected. These are pure redirects, so
    # unlike the pretty-URL fallbacks below they do not depend on any JS
    # having loaded yet.
    location ~ ^/(season-13|season-15|world-of-wonders|shared-skies|new-season|new-season-2026|might-and-mastery|delightful-days|precious-paths|memories|forever-forward|twilight-trails)/(.*)$ {
        return 301 /$2;
    }

    location /unite {
        return 301 https://unite.pvpoke.com;
    }

    location /contribute {
        return 301 https://pvpoke.com/contact;
    }

    # Deep links used to be rewritten into a query string for the matching .php
    # page. That translation now happens in js/Router.js, but only once a page
    # has loaded, so a cold visit to /battle/multi/2500/ultra/... still has to
    # receive the right HTML file for Router.js to parse. try_files serves the
    # real file when it exists and falls back to the page shell otherwise.
    location /battle       { try_files $uri /battle.html; }
    location /rankings     { try_files $uri /rankings.html; }
    location /team-builder { try_files $uri /team-builder.html; }
    location /moves        { try_files $uri /moves.html; }
    location /tera         { try_files $uri /tera/index.html; }
    location /train        { try_files $uri /train/index.html; }
    location /gm-editor    { try_files $uri /gm-editor/index.html; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # Assets carry a ?v= cache buster, so they can be cached hard.
    location ~* \.(css|js|json|png|jpe?g|gif|svg|webp|woff2?|ico|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
