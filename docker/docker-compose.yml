version: '3.9'

services:
  web:
    container_name: pvpoke
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # Use port set in PVPOKE_PORT env variable, use port 80 as default
      - "${PVPOKE_PORT:-80}:80"
    volumes:
      # Mounted read-only: the site is static, nothing in the container writes
      # to it. WEB_ROOT is "/", so src/ has to be the document root rather than
      # a subdirectory the way the old Apache setup served it from /pvpoke/src/.
      - ../src:/usr/share/nginx/html:ro
