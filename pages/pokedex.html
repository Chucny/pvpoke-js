<!-- description: Explore Pokemon stats for Pokemon GO PvP. -->

<!--#include header-->



<h1>Pokedex</h1>
<div class="section moves white">
	
	<select class="league-select">
		<option value="500" level-cap="50">Little League</option>
		<option value="1500" level-cap="50" selected>Great League</option>
		<option value="2500" level-cap="50">Ultra League</option>
		<option value="10000" level-cap="50">Master League</option>
	</select>






	<p>Sort or filter the moves below, or experiment with a custom moveset.</p>

	<h2 class="loading">Loading data...</h2>
	<div class="poke-table-container">
		<input class="poke-search" context="poke-search" type="text" placeholder="Search Move or Type" />
		<table class="sortable-table stats-table pokemon" cellpadding="0" cellspacing="0"></table>
	</div>
</div>
